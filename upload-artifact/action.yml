name: 'Upload a Build Artifact (BMC)'
description: >-
  Upload a build artifact to the BMC artifact store. Drop-in for
  actions/upload-artifact@v4 on BMC runners — BMC runners ONLY: the
  runner must have the BMC artifact store mounted (staged by the BMC
  start operation as BMC_ARTIFACT_STORE='1'). On GitHub-hosted runners
  the action refuses loudly and makes no network calls; keep
  actions/upload-artifact there.
author: 'bare-metal-cloud'
inputs:
  name:
    description: 'Artifact name'
    default: 'artifact'
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload'
    required: true
  if-no-files-found:
    description: >
      The desired behavior if no files are found using the provided path.

      Available Options:
        warn: Output a warning but do not fail the action
        error: Fail the action with an error message
        ignore: Do not output any warnings or errors, the action does not fail
    default: 'warn'
  retention-days:
    description: >
      Accepted for upstream compatibility. BMC storage retention is
      governed by the org's retention policy; this input never changes
      it and only produces a warning. 0 means using default retention.
  compression-level:
    description: >
      The level of compression for Zlib to be applied to the artifact archive.
      The value can range from 0 to 9:
      - 0: No compression
      - 1: Best speed
      - 6: Default compression (same as GNU Gzip)
      - 9: Best compression
      Higher levels will result in better compression, but will take longer to complete.
      For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
    default: '6'
  overwrite:
    description: >
      If true, an artifact with a matching name will be replaced by the new
      upload (the BMC store's re-create arm). If false, the action will fail
      if an artifact for the given name already exists.
      Does not fail if the artifact does not exist.
    default: 'false'
  include-hidden-files:
    description: >
      If true, hidden files will be included in the artifact.
      If false, hidden files will be excluded from the artifact.
    default: 'false'

outputs:
  artifact-id:
    description: >
      A unique identifier for the artifact that was just uploaded (the BMC
      store's artifact id). Empty if the artifact upload failed.

      This ID can be passed to bmc-actions/download-artifact's
      artifact-ids input within the same workflow run.
  artifact-url:
    description: >
      A web-UI URL for the artifact, composed from the workflow's own
      GITHUB_SERVER_URL / GITHUB_REPOSITORY / GITHUB_RUN_ID, or empty when
      those are absent. (BMC artifacts are served to jobs of the same run
      through download-artifact; there is no GitHub API URL.)
  artifact-digest:
    description: >
      SHA-256 digest for the artifact that was just uploaded. Empty if the artifact upload failed.
runs:
  using: 'node20'
  main: 'dist/index.js'
